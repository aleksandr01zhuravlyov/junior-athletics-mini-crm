<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Junior Athletics Mini CRM</title>

  <!-- Connect the CSS file (the looks) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <header class="header">
    <div>
      <h1>Junior Athletics</h1>
      <p>Mini CRM</p>
    </div>
    <div class="user-box" id="user-box" hidden>
      <span id="user-email"></span>
      <button type="button" id="logout-btn">Log out</button>
    </div>
  </header>

  <!-- Login screen (shown when nobody is logged in) -->
  <main class="container" id="login-view" hidden>
    <form class="login-card" id="login-form">
      <h2>Log in</h2>
      <label>Email <input id="login-email" type="email" autocomplete="username" required></label>
      <label>Password <input id="login-password" type="password" autocomplete="current-password" required></label>
      <p class="message error" id="login-error" hidden></p>
      <button type="submit" class="btn-primary" id="login-submit">Log in</button>
    </form>
  </main>

  <!-- The CRM (shown only when logged in) -->
  <main class="container" id="app-view" hidden>

    <p class="message error" id="app-error" hidden></p>

    <!-- Dashboard: the boxes at the top -->
    <section class="dashboard">
      <div class="card">
        <h2>Present Today</h2>
        <p class="big-number" id="present-count">0</p>
      </div>
      <div class="card">
        <h2>Absent Today</h2>
        <p class="big-number" id="absent-count">0</p>
      </div>
      <div class="card">
        <h2>Total Students</h2>
        <p class="big-number" id="total-count">0</p>
      </div>
    </section>

    <!-- Student list -->
    <section class="students">
      <div class="students-header">
        <h2>Students</h2>
        <button class="btn-primary" id="add-student-btn">+ Add Student</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Membership</th>
            <th>Sessions Left</th>
            <th>Today</th>
            <th>Attendance</th>
            <th>Manage</th>
          </tr>
        </thead>
        <!-- JavaScript fills this empty body with one row per student -->
        <tbody id="student-table-body"></tbody>
      </table>
      <p class="message" id="table-message">Loading students...</p>
    </section>

  </main>

  <!-- Add / Edit form (one form used for both) -->
  <dialog id="form-dialog">
    <form id="student-form">
      <h2 id="form-title">Add Student</h2>
      <label>First name <input id="f-first" required></label>
      <label>Last name <input id="f-last" required></label>
      <label>Date of birth <input id="f-dob" type="date" required></label>
      <label>Parent name <input id="f-parent" required></label>
      <label>Parent phone <input id="f-phone" type="tel" required></label>
      <label>Membership type
        <select id="f-membership">
          <option>Monthly</option>
          <option>10-Session Pass</option>
          <option>Drop-in</option>
        </select>
      </label>
      <label>Sessions remaining <input id="f-sessions" type="number" min="0" required></label>
      <div class="dialog-buttons">
        <button type="button" id="form-cancel">Cancel</button>
        <button type="submit" class="btn-primary" id="form-save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Details view -->
  <dialog id="details-dialog">
    <h2 id="details-title"></h2>
    <dl id="details-body"></dl>
    <div class="dialog-buttons">
      <button type="button" id="details-close">Close</button>
    </div>
  </dialog>

  <!-- Connect the JavaScript file (the brain). It goes last so the page exists first. -->
  <!-- Official Supabase client (loads as global "supabase"), then our settings, then our code -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
